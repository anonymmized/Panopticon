name: macOS build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Source acceptance
        run: ./scripts/check_release.sh
      - name: Package and verify app
        run: ARCH=universal ./build.sh
      - name: Package DMG
        run: ./scripts/make_dmg.sh --skip-build
      - name: Installer rollback
        run: ./scripts/test_install.sh
      - name: Verify distribution
        run: ./scripts/verify_distribution.sh build/*.dmg
      - name: Archive app
        run: ditto -c -k --keepParent build/Panopticon.app build/Panopticon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Panopticon
          path: |
            build/Panopticon.zip
            build/*.dmg
            build/*.sha256
            build/*.manifest.json
